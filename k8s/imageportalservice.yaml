apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-portal-service
  namespace: image-portal-dev
  labels:
    app: image-portal-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-portal-service
  template:
    metadata:
      labels:
        app: image-portal-service
    spec:
      imagePullSecrets:
        - name: docker-hub-secret
      containers:
        - name: image-portal
          image: solomondocker10277/imageportal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8070
          envFrom:
            - configMapRef:
                name: shared-infra-config
            - configMapRef:
                name: image-portal-config
            - secretRef:
                name: image-portal-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "800M"
              cpu: "500m"
          # Startup probe gives the app up to 180s (30s delay + 15 * 10s) to boot cleanly.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8070
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 15

          # Readiness probe takes over after startup succeeds.
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8070
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 2

          # Liveness probe takes over after startup succeeds.
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8070
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: image-portal-service
  namespace: image-portal-dev
spec:
  type: NodePort
  ports:
    - port: 8070
      targetPort: 8070
      nodePort: 30070
  selector:
    app: image-portal-service