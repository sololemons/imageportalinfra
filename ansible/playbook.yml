---
- name: Zero-Touch Infrastructure & Base K8s Provisioning
  hosts: ubuntu_servers
  become: true
  gather_facts: false

  vars:
    host_workspace: "{{ workspace | default(playbook_dir + '/..') }}"
    terraform_dir: "{{ host_workspace }}/terraform"
    k8s_dir: "{{ host_workspace }}/k8s"
    k8s_namespace: "image-portal-dev"
    floci_image: "floci/floci:latest"
    floci_port: "4566"
    subscriber_email: "solomonndimu75@gmail.com"
    user_kubeconfig: "/home/{{ ansible_user }}/.kube/config"

  tasks:
    - name: Ensure Floci emulator container is running
      community.docker.docker_container:
        name: floci_main
        image: "{{ floci_image }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ floci_port }}:4566"
      become: true

    - name: Check Minikube status
      ansible.builtin.command: minikube status
      register: minikube_status
      failed_when: false
      changed_when: false
      check_mode: false
      become: false

    - name: Start Minikube if needed
      ansible.builtin.command: minikube start --driver=docker --memory=2560mb --cpus=2
      when: "'Running' not in minikube_status.stdout"
      become: false

    - name: Provision S3 & SNS via Terraform
      community.general.terraform:
        project_path: "{{ terraform_dir }}"
        state: present
        force_init: true
        variables:
          subscriber_email: "{{ subscriber_email }}"
      register: tf_result
      become: true

    - name: Ensure Target Namespace Exists
      ansible.builtin.shell: |
        kubectl create namespace {{ k8s_namespace }} --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false
      become: false

    - name: Publish Shared Infrastructure ConfigMap
      ansible.builtin.shell: |
        kubectl create configmap shared-infra-config \
          --namespace={{ k8s_namespace }} \
          --from-literal=S3_BUCKET_NAME="{{ tf_result.outputs.s3_bucket_name.value }}" \
          --from-literal=SNS_TOPIC_ARN="{{ tf_result.outputs.sns_topic_arn.value }}" \
          --dry-run=client -o yaml | kubectl apply -f -
      become: false

    - name: Create or Update App Secrets (DB & JWT)
      ansible.builtin.shell: |
        kubectl create secret generic image-portal-secret \
          --namespace={{ k8s_namespace }} \
          --from-literal=SPRING_DATASOURCE_PASSWORD="{{ db_pass }}" \
          --from-literal=APP_JWT_SECRET="{{ jwt_secret }}" \
          --dry-run=client -o yaml | kubectl apply -f -
      become: true
      environment:
        KUBECONFIG: "{{ user_kubeconfig }}"

    - name: Create or Update Docker Hub Registry Secret
      ansible.builtin.shell: |
        kubectl create secret docker-registry docker-hub-secret \
          --namespace={{ k8s_namespace }} \
          --docker-server=https://index.docker.io/v1/ \
          --docker-username="{{ docker_user }}" \
          --docker-password="{{ docker_pass }}" \
          --docker-email="{{ subscriber_email }}" \
          --dry-run=client -o yaml | kubectl apply -f -
      become: true
      environment:
        KUBECONFIG: "{{ user_kubeconfig }}"

    - name: Apply All Base Kubernetes Manifests (MySQL, Base App Deployment)
      ansible.builtin.command: "kubectl apply -f {{ k8s_dir }}/ -n {{ k8s_namespace }}"
      become: true
      environment:
        KUBECONFIG: "{{ user_kubeconfig }}"

    - name: Wait for MySQL Pod to be Ready
      ansible.builtin.command: "kubectl rollout status deployment/mysql -n {{ k8s_namespace }} --timeout=120s"
      become: true
      environment:
        KUBECONFIG: "{{ user_kubeconfig }}"